<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manutenção — Pastor Xbox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #0e0e0e;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 1.25rem;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid #107c10;
      margin: 0 auto 1.5rem;
      display: block;
      box-shadow: 0 0 20px rgba(16,124,16,0.4);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }
    .brand { color: #107c10; }
    p {
      font-size: 1rem;
      color: #a0a0a0;
      line-height: 1.6;
      margin-top: 1rem;
    }
    .icon {
      margin-top: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #555;
      font-size: 0.85rem;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid #333;
      border-top-color: #107c10;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer {
      margin-top: 2.5rem;
      color: #444;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="/assets/img/pastorxbox-avatar.png" alt="Pastor Xbox" />
    <h1>Estamos em <span class="brand">manutenção</span></h1>
    <p>O site do <strong>Pastor Xbox</strong> está sendo atualizado.<br>Voltamos em breve!</p>
    <div class="icon">
      <span class="spinner"></span>
      Atualizando o site…
    </div>
  </div>
  <footer>&copy; Pastor Xbox</footer>
</body>
</html>
